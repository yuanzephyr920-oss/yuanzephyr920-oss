    <text x="62" y="168" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="58" font-weight="700" letter-spacing="-1.2" fill="#e9f2f7">yuanzephyr</text>
